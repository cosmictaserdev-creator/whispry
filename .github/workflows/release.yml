name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so --generate-notes can see every commit since the last tag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore is never committed — see keystore.properties/keystore/ in .gitignore.
      # This job reconstructs both from repo secrets, signs with them, and discards them.
      - name: Reconstruct signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/whispry-release.jks
          cat > keystore.properties << EOF
          storeFile=keystore/whispry-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "name=whispry-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK and generate checksum
        run: |
          cp "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.name }}"
          sha256sum "${{ steps.apk.outputs.name }}" > checksums.txt
          cat checksums.txt

      - name: Clean up keystore
        if: always()
        run: rm -rf keystore keystore.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.name }}
            checksums.txt
